site_name: openDendro
site_description: Open-source software for tree-ring science, in R, in Python and in the browser.
site_author: Andy Bunn, Kevin Anchukaitis, Tyson Swetnam
site_url: https://opendendro.org

# Repository
repo_name: opendendro/opendendro
repo_url: https://github.com/opendendro/opendendro
edit_uri: edit/main/docs/
# Copyright
copyright: 'Copyright &copy; 2021 - 2026 Andy Bunn'

# Page tree
nav:
  - Home: index.md
  - Apps: apps.md
  - R: r.md
  - Python:
    - dplPy: python.md
    - Notebooks:
      - Introduction Example: notebooks/intro_dplpy.ipynb
      - Floating Chronology Example: notebooks/floating_chronology_example.ipynb
      - Bristlecone Pine Example: notebooks/bristlecone_example.ipynb
      - ITRDB API: notebooks/itrdb.ipynb
  - About:
    - About openDendro: about.md
    - Where the Methods Come From: fortran.md
    - Run It on CyVerse: cyverse.md
    - Get Involved: contribute.md

# Pages kept for old links but left out of the menus
not_in_nav: |
  bootcamp.md
  docker.md
  notebooks/new.ipynb

# Configuration
theme:
  name: material
  font:
    text: 'Open Sans'
    code: 'Roboto Mono'
  logo: 'assets/openDendroSticker.png'
  favicon: 'assets/favicon.ico'
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - toc.follow
    - content.code.copy
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  # Adds the download button to the notebook pages
  custom_dir: "docs/overrides"

# Options
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/opendendro

# Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

plugins:
    - search
    - git-revision-date
    - mkdocs-jupyter:
          include_source: True
          ignore_h1_titles: True
